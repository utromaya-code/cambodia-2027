name: Build & Deploy

# Деплой только с основной ветки. Так рабочая ветка, залитая в любой другой
# репозиторий, не перезапишет чужой сайт на GitHub Pages.
# Разовую публикацию из ветки можно запустить вручную через workflow_dispatch.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: важен только последний коммит.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci
        env:
          # Playwright нужен только для локальных проверок скриншотами.
          # В сборке браузеры качать незачем — это ~150 МБ и лишние минуты.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Проверить типы
        run: npm run typecheck

      - name: Собрать сайт
        run: npm run build
        env:
          # Пусто по умолчанию — тогда используются значения из astro.config.mjs.
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          PUBLIC_LEAD_WEBHOOK_URL: ${{ secrets.PUBLIC_LEAD_WEBHOOK_URL }}

      # enablement: true включает GitHub Pages сам, если он ещё не включён,
      # — чтобы не требовать ручного переключения в настройках репозитория.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
